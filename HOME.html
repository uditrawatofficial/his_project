<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<style>

     :root{
    --navy-deep:   #0a1420;
    --navy-panel:  #101f31;
    --navy-line:   #1c3350;
    --bronze:      #b6884c;
    --bronze-light:#e0c48c;
    --copper:      #9c5a34;
    --cream:       #ece3cf;
    --muted:       #8fa0b8;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--navy-deep);
    color:var(--cream);
    font-family:'Cormorant Garamond', serif;
    font-size:19px;
    line-height:1.65;
    overflow-x:hidden;
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(182,136,76,0.09), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  }

  a{ color:inherit; text-decoration:none; }

  /* FIX: prevent any image from overflowing the page */
  img{
    max-width:100%;
    height:auto;
    display:block;
  }

  .eyebrow{
    font-family:'Jost', sans-serif;
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--bronze);
  }

  h1,h2,h3{
    font-family:'Cinzel', serif;
    font-weight:600;
    letter-spacing:0.03em;
    color:var(--bronze-light);
  }

  .reel-divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:0 auto;
    width:min(560px, 84%);
    opacity:0.9;
  }
  .reel-divider .line{
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--bronze) 50%, transparent);
  }
  .reel-divider .hub{
    width:34px; height:34px;
    border:1px solid var(--bronze);
    border-radius:50%;
    position:relative;
    flex-shrink:0;
  }
  .reel-divider .hub::before{
    content:"";
    position:absolute; inset:7px;
    border:1px solid var(--copper);
    border-radius:50%;
  }
  .reel-divider .hub::after{
    content:"";
    position:absolute; inset:14px;
    background:var(--bronze);
    border-radius:50%;
  }

  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 6%;
    background:rgba(10,20,32,0.88);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--navy-line);
  }
  .brand{
    display:flex; align-items:center; gap:12px;
    font-family:'Cinzel', serif;
    font-size:19px;
    letter-spacing:0.12em;
    color:var(--cream);
  }
  .brand img{
    width:42px; height:42px; border-radius:50%;
    box-shadow:0 0 0 1px var(--bronze), 0 0 18px rgba(182,136,76,0.25);
  }
  nav ul{
    list-style:none;
    display:flex;
    gap:34px;
    font-family:'Jost', sans-serif;
    font-size:13px;
    letter-spacing:0.18em;
    text-transform:uppercase;
  }
  nav a{
    position:relative;
    color:var(--muted);
    transition:color .3s ease;
    padding-bottom:4px;
  }
  nav a:hover{ color:var(--bronze-light); }
  nav a::after{
    content:"";
    position:absolute; left:0; bottom:0;
    width:0; height:1px;
    background:var(--bronze);
    transition:width .3s ease;
  }
  nav a:hover::after{ width:100%; }

  .hero{
    min-height:92vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:80px 6% 60px;
    position:relative;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 38%, rgba(182,136,76,0.10), transparent 45%);
    pointer-events:none;
  }
  .hero img.logo{
    width:170px; height:170px;
    margin-bottom:34px;
    border-radius:50%;
    box-shadow:0 0 0 1px rgba(182,136,76,0.5), 0 0 60px rgba(182,136,76,0.15);
    animation:rise 1.1s ease both;
  }
  .hero .eyebrow{ animation:rise 1.1s ease .15s both; }
  .hero h1{
    font-size:clamp(40px, 7vw, 78px);
    margin:14px 0 8px;
    animation:rise 1.1s ease .25s both;
  }
  .hero p.tag{
    font-family:'Jost', sans-serif;
    font-size:14px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:38px;
    animation:rise 1.1s ease .35s both;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .btn{
    display:inline-block;
    font-family:'Jost', sans-serif;
    font-size:13px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    padding:15px 38px;
    border:1px solid var(--bronze);
    color:var(--bronze-light);
    background:transparent;
    transition:all .35s ease;
    animation:rise 1.1s ease .45s both;
  }
  .btn:hover{
    background:var(--bronze);
    color:var(--navy-deep);
    box-shadow:0 0 24px rgba(182,136,76,0.35);
  }

  section{ padding:110px 6%; max-width:1180px; margin:0 auto; }
  .section-head{ text-align:center; margin-bottom:64px; }
  .section-head h2{ font-size:clamp(28px, 4vw, 40px); margin-top:12px; }
  .section-head p{ color:var(--muted); max-width:560px; margin:16px auto 0; font-size:19px; }

  .about{
    display:grid;
    grid-template-columns:0.85fr 1.15fr;
    gap:70px;
    align-items:center;
  }
  .about .frame{
    position:relative;
    aspect-ratio:4/5;
    border:1px solid var(--navy-line);
    padding:18px;
  }
  .about .frame::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid var(--bronze);
    opacity:0.55;
  }
  .about .frame .inner{
    width:100%; height:100%;
    background:linear-gradient(160deg, #16283f, #0b1520 70%);
    display:flex; align-items:center; justify-content:center;
    color:var(--bronze);
    font-family:'Cinzel', serif;
    letter-spacing:0.3em;
    font-size:13px;
    text-align:center;
  }
  .about h2{ font-size:34px; margin-bottom:22px; }
  .about p{ color:var(--muted); margin-bottom:16px; font-size:19px; }
  .about .credit-line{
    margin-top:26px;
    display:flex; gap:40px;
    font-family:'Jost', sans-serif;
  }
  .about .credit-line div strong{
    display:block; font-family:'Cinzel', serif; color:var(--bronze-light); font-size:24px;
  }
  .about .credit-line div span{
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted);
  }

  .services-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:1px;
    background:var(--navy-line);
    border:1px solid var(--navy-line);
  }
  .service-card{
    background:var(--navy-deep);
    padding:46px 34px;
    transition:background .35s ease;
  }
  .service-card:hover{ background:var(--navy-panel); }
  .service-card .num{
    font-family:'Cinzel', serif;
    color:var(--copper);
    font-size:13px;
    letter-spacing:0.2em;
    margin-bottom:20px;
    display:block;
  }
  .service-card h3{ font-size:22px; margin-bottom:12px; }
  .service-card p{ color:var(--muted); font-size:17px; }

  .work-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:22px;
  }
  .work-item{
    aspect-ratio:3/4;
    position:relative;
    overflow:hidden;
    border:1px solid var(--navy-line);
    background:linear-gradient(160deg, #16283f 0%, #0b1520 75%);
  }
  .work-item .label{
    position:absolute; left:0; right:0; bottom:0;
    padding:18px 20px;
    background:linear-gradient(0deg, rgba(10,20,32,0.92), transparent);
    font-family:'Jost', sans-serif;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--bronze-light);
    transform:translateY(6px);
    opacity:0;
    transition:all .35s ease;
  }
  .work-item:hover .label{ opacity:1; transform:translateY(0); }
  .work-item::after{
    content:"";
    position:absolute; inset:0;
    border:1px solid transparent;
    transition:border-color .35s ease;
  }
  .work-item:hover::after{ border-color:var(--bronze); }

  .quote-strip{
    text-align:center;
    padding:100px 6%;
    background:var(--navy-panel);
    border-top:1px solid var(--navy-line);
    border-bottom:1px solid var(--navy-line);
  }
  .quote-strip blockquote{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:clamp(22px, 3vw, 30px);
    max-width:760px;
    margin:0 auto 22px;
    color:var(--cream);
  }
  .quote-strip cite{
    font-family:'Jost', sans-serif;
    font-style:normal;
    font-size:12px;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color:var(--bronze);
  }

  .contact-wrap{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
  }
  .contact-info h2{ font-size:34px; margin-bottom:20px; }
  .contact-info p{ color:var(--muted); margin-bottom:30px; }
  .contact-info .detail{ margin-bottom:22px; }
  .contact-info .detail span{
    display:block;
    font-family:'Jost', sans-serif;
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--copper); margin-bottom:6px;
  }
  .contact-info .detail strong{ font-family:'Cinzel', serif; font-size:17px; color:var(--bronze-light); font-weight:400; }

  form{ display:flex; flex-direction:column; gap:22px; }
  .field label{
    display:block;
    font-family:'Jost', sans-serif;
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px;
  }
  .field input, .field textarea{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--navy-line);
    padding:10px 2px;
    color:var(--cream);
    font-family:'Cormorant Garamond', serif;
    font-size:18px;
    outline:none;
    transition:border-color .3s ease;
  }
  .field input:focus, .field textarea:focus{ border-color:var(--bronze); }
  form .btn{ align-self:flex-start; margin-top:10px; border-width:1px; cursor:pointer; animation:none; }

  footer{
    padding:50px 6% 40px;
    text-align:center;
    border-top:1px solid var(--navy-line);
  }
  footer .brand{ justify-content:center; margin-bottom:16px; }
  footer p{
    font-family:'Jost', sans-serif;
    font-size:12px;
    letter-spacing:0.15em;
    color:var(--muted);
  }
  .welcome-img{
    max-width:100%;
    height:auto;
    display:block;
    margin:20px auto;
  }





</style>
